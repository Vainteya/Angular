<!DOCTYPE html>
<html lang="en" ng-app="studyNotesApp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Notes Organizer</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app" ng-view></main>

  <!-- AngularJS 1.8.3 and ngRoute from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular-route.min.js"></script>

  <!-- App scripts: module first, then services, then controllers -->
  <script src="js/app.js"></script>
  <script src="js/services/auth.service.js"></script>
  <script src="js/services/notes.service.js"></script>
  <script src="js/controllers/login.controller.js"></script>
  <script src="js/controllers/notes.controller.js"></script>
  <script src="js/controllers/editor.controller.js"></script>
</body>
</html>
