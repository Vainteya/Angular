<header class="topbar">
  <a class="back" href="#!/notes">&larr; All notes</a>
</header>

<div class="empty" ng-if="notFound">
  <p>Note not found.</p>
  <p class="muted">It may have been deleted.</p>
  <a class="btn" href="#!/notes">Back to notes</a>
</div>

<form name="editorForm" class="editor" ng-if="!notFound" ng-submit="save(editorForm)" novalidate>
  <h1 class="editor-heading">{{ isNew ? 'New note' : 'Edit note' }}</h1>

  <div class="field">
    <label for="title">Title</label>
    <input id="title" name="title" type="text" maxlength="120"
           ng-model="note.title" placeholder="e.g. Binary search template"
           required autofocus>
    <p class="field-error" ng-if="submitted && titleIsBlank()">A title is required.</p>
  </div>

  <div class="field">
    <label for="body">Note</label>
    <textarea id="body" name="body" rows="14" ng-model="note.body"
              ng-trim="false" placeholder="Write your note or paste a code snippet…"></textarea>
  </div>

  <div class="actions">
    <button type="button" class="btn btn-danger" ng-if="!isNew" ng-click="remove()">Delete</button>
    <span class="spacer"></span>
    <button type="button" class="btn" ng-click="cancel()">Cancel</button>
    <button type="submit" class="btn btn-primary">Save</button>
  </div>
</form>
